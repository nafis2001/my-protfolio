name: Unpack cinematic portfolio source
on:
  push:
    branches: [main]
    paths:
      - 'nafis-cinematic-portfolio/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing portfolio repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand Next.js portfolio without touching existing Astro site
        shell: bash
        run: |
          set -euo pipefail
          cat nafis-cinematic-portfolio/.archive/part*.txt | base64 -d > /tmp/nafis-cinematic.tar.xz
          tar -xJf /tmp/nafis-cinematic.tar.xz -C nafis-cinematic-portfolio --strip-components=1
          rm -rf nafis-cinematic-portfolio/.archive nafis-cinematic-portfolio/READY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A nafis-cinematic-portfolio
          if ! git diff --cached --quiet; then
            git commit -m "Publish full cinematic Next.js portfolio source"
            git push
          fi
